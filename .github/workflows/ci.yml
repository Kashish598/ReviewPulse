name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a pull request cancels the older run. Runs on main and on tags always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ruff (same pin as requirements.txt)
        run: pip install "$(grep -E '^ruff==' requirements.txt)"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Docker requirements match requirements.txt
        run: python scripts/check_requirements_sync.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # CPU-only torch first, so requirements.txt does not pull the large CUDA build.
      - name: Install CPU-only torch
        run: pip install "$(grep -E '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The API tests use MockPredictor and the BERT tests stub the pipeline, so no model file is needed.
      - name: Test
        run: pytest -v

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (ghcr.io needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: reviewpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test, the app imports inside the image
        run: docker run --rm reviewpulse:ci python -c "import src.app"
      # Only pushes to main and version tags publish an image. Pull requests stop after the build.
      - name: Image tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Set the repository variable MODEL_HF_REPO (Settings > Secrets and variables > Actions >
      # Variables) and the published image carries the fine-tuned model. Empty means it does not.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MODEL_HF_REPO=${{ vars.MODEL_HF_REPO }}
            MODEL_HF_REVISION=${{ vars.MODEL_HF_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
